<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · chan.py 缠论量化</title>
<link rel="stylesheet" href="css/design.css">
<style>
  /* 登录页：独立居中，无 AppShell */
  .login-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(59, 130, 246, 0.10), transparent 60%),
      radial-gradient(700px 500px at 85% 110%, rgba(246, 70, 93, 0.06), transparent 55%),
      var(--bg-base);
  }
  /* 背景坐标纸网格 + 缓慢漂移 */
  .login-page::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(42, 48, 58, 0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42, 48, 58, 0.35) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 75%);
  }

  .login-card {
    position: relative;
    z-index: 2;
    width: 400px;
    padding: 32px;
    background: var(--bg-surface);
    border: 1px solid var(--border-base);
    border-radius: var(--r-lg);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .login-brand { display: flex; flex-direction: column; gap: 8px; }
  .login-brand .row { display: flex; align-items: center; gap: 10px; }
  .login-brand .title { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .login-brand .sub { font-size: 12px; color: var(--text-disabled); letter-spacing: 0.1em; }

  /* 终端提示行装饰 */
  .term-line {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-disabled);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-chart);
    border: 1px solid var(--border-base);
    border-radius: var(--r-md);
  }
  .term-line .prompt { color: var(--fall); }
  .term-line .cmd { color: var(--text-secondary); }

  .login-btn { width: 100%; height: 36px; }

  .error-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--rise);
  }

  .login-foot {
    position: absolute;
    bottom: 24px;
    z-index: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-disabled);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="login-page">

  <div class="login-card reveal">
    <div class="login-brand">
      <div class="row">
        <span class="brand-mark" style="width:28px;height:28px;font-size:15px"></span>
        <span class="title">chan<span class="accent" style="color:var(--accent-hover)">.py</span> 缠论量化<span class="brand-cursor" style="height:18px"></span></span>
      </div>
      <span class="sub">量化终端 · 用户认证</span>
    </div>

    <div class="term-line">
      <span class="prompt">$</span>
      <span class="cmd">authenticate --user --passwd</span>
    </div>

    <div class="form-row">
      <label>用户名</label>
      <div class="field" style="height:36px">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input placeholder="用户名" autocomplete="username">
      </div>
    </div>

    <div class="form-row">
      <label>密码</label>
      <div class="field" style="height:36px">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input type="password" placeholder="密码" autocomplete="current-password">
      </div>
    </div>

    <button class="btn btn--primary login-btn">登录</button>

    <div class="error-hint">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.01"/></svg>
      用户名或密码错误，请重试
    </div>
  </div>

  <span class="login-foot">chan.py · MIT · 暗色终端 · 红涨绿跌</span>

</div>
<script src="js/app.js"></script>
</body>
</html>
