<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K线图表 · chan.py 缠论量化</title>
<link rel="stylesheet" href="css/design.css">
<style>
  /* K线页独立单页，无 AppShell */
  .kline-page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-height: 720px;
    background: var(--bg-base);
  }

  /* 顶栏工具栏 */
  .topbar {
    display: flex;
    align-items: center;
    gap: var(--sp-md);
    height: var(--topbar-h);
    padding: 0 var(--sp-lg);
    border-bottom: 1px solid var(--border-base);
    background: var(--bg-surface);
    flex-shrink: 0;
  }
  .topbar .brand-mark { margin-right: 4px; }
  .topbar .divider { width: 1px; height: 20px; background: var(--border-base); margin: 0 4px; }

  /* 主图区 */
  .main-chart {
    flex: 1;
    min-height: 320px;
    margin: var(--sp-lg) var(--sp-lg) var(--sp-sm);
  }
  .subchart {
    height: 130px;
    margin: var(--sp-sm) var(--sp-lg) 0;
  }
  .subchart:last-of-type { margin-bottom: var(--sp-lg); }

  .legend-trigger {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    margin-left: auto;
  }
  .legend-trigger:hover { background: var(--bg-surface-hover); color: var(--text-primary); }

  /* 图例 */
  .legend-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-secondary);
    padding: 3px 0;
  }
  .legend-row .sw { width: 16px; height: 0; border-top: 2px solid var(--text-secondary); }
  .legend-row .sw--seg { border-color: var(--accent-base); border-top-width: 3px; }
  .legend-row .sw--box { width: 16px; height: 9px; border: 1px dashed var(--text-secondary); border-top: none; border-radius: 1px; }
  .legend-row .sw--box2 { border-color: var(--accent-base); border-style: solid; background: rgba(59,130,246,0.12); }
  .legend-row .dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-row .dot--buy { background: var(--rise); }
  .legend-row .dot--sell { background: var(--fall); }
  .legend-title { font-size: 11px; color: var(--text-disabled); letter-spacing: 0.08em; margin-bottom: 4px; }

  .last-quote {
    position: absolute; top: 10px; left: 14px;
    display: flex; align-items: baseline; gap: 8px;
    z-index: 5;
  }
  .last-quote .px { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--rise); }
  .last-quote .chg { font-family: var(--font-mono); font-size: 12px; color: var(--rise); }
</style>
</head>
<body>
<div class="kline-page">

  <!-- 顶栏工具栏 -->
  <header class="topbar reveal">
    <span class="brand-mark"></span>
    <span class="brand-name" style="font-size:14px">chan<span class="accent">.py</span></span>
    <span class="divider"></span>

    <div class="field" style="width:200px">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input value="sz.000001" aria-label="股票代码">
    </div>

    <div class="select">
      <button class="select__trigger" type="button">
        <span class="select__value">日线</span>

      </button>
      <div class="select__menu">
        <div class="select__option" data-label="1分钟">1分钟</div>
        <div class="select__option" data-label="5分钟">5分钟</div>
        <div class="select__option" data-label="1小时">1小时</div>
        <div class="select__option is-selected" data-label="日线">日线</div>
      </div>
    </div>

    <div class="select select--multi">

      </button>

        <div class="select__option"><span class="check-dot is-on"></span>成交量</div>
        <div class="select__option"><span class="check-dot is-on"></span>MACD</div>
        <div class="select__option"><span class="check-dot"></span>BOLL</div>
        <div class="select__option"><span class="check-dot"></span>RSI</div>
        <div class="select__option"><span class="check-dot"></span>KDJ</div>
      </div>
    </div>

    <div class="tip legend-trigger">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <div class="tip__bubble">
        <div class="legend-title">缠论图例</div>
        <div class="legend-row"><span class="sw"></span>笔（灰线）</div>
        <div class="legend-row"><span class="sw sw--seg"></span>线段（蓝线）</div>
        <div class="legend-row"><span class="sw sw--box"></span>笔中枢（灰框）</div>
        <div class="legend-row"><span class="sw sw--box sw--box2"></span>线段中枢（蓝框）</div>
        <div class="legend-row"><span class="dot dot--buy"></span>买点（1B/2B/L2B/3B）</div>
        <div class="legend-row"><span class="dot dot--sell"></span>卖点（1S/2S/L2S/3S）</div>
      </div>
    </div>
  </header>
